version: 1
project:
  id: aipol
  repository: nextain/aipol
  issue_tracker: github
  default_branch: main
  integration_branch: main
workspace:
  ssh_home_pattern: "/opt/aipol/workspaces/aipol"
  branch_pattern: "issue/<number>-<short-name>"
roles:
  contributors: [policy_collaborator]
  integrators: [workspace_owner]
  release_owners: [workspace_owner]
discord:
  enabled: true
  project_alias: aipol
  bot_token_env: DISCORD_AIPOL_TOKEN
  runtime_registry: .runtime/participants.json
  contact_window:
    timezone: Asia/Seoul
    days: [mon, tue, wed, thu, fri]
    start_hour: 10
    end_hour: 18
  default_responder_alias: workspace_owner
commands:
  validate: "python -m pytest -q"
  deploy_dev: "bash /opt/aipol/workspaces/aipol-lab/internal/operations/aipol-dev/scripts/deploy-dev.sh"
  deploy_production: null
guards:
  production_requires_issue_approval: true
  database_write_requires_explicit_authority: true
execution:
  deploy_gate_command: "bash /opt/aipol/workspaces/aipol-lab/internal/operations/aipol-dev/scripts/deploy-gate.sh"
  artifact:
    build_from: committed_revision
    intake_scan_command: "/opt/aipol/current/naia-pj-adk/scripts/public-safety-scan.mjs"
  propagation:
    development:
      reload_command: "bash /opt/aipol/workspaces/aipol-lab/internal/operations/aipol-dev/scripts/deploy-dev.sh"
      cache_invalidation_command: "/bin/true"
      serving_revision_proof_command: "bash /opt/aipol/workspaces/aipol-lab/internal/operations/aipol-dev/scripts/verify-dev.sh"
    production:
      reload_command: null
      cache_invalidation_command: null
      serving_revision_proof_command: null
  verification:
    command: "bash /opt/aipol/workspaces/aipol-lab/internal/operations/aipol-dev/scripts/verify-dev.sh"
    required_strings: ["AIPOL"]
    consecutive_passes: 2
  rollback:
    development: "bash /opt/aipol/workspaces/aipol-lab/internal/operations/aipol-dev/scripts/rollback-dev.sh"
    production: null
  concurrency:
    lease_file: .runtime/mutation-lease.json
    shared_targets: [development, production]
  drift_check_command: "bash /opt/aipol/workspaces/aipol-lab/internal/operations/aipol-dev/scripts/check-drift.sh"
tiers:
  development:
    url: "https://dev.aipol.kaps.or.kr"
    source_revision_origin: integration_branch
    database: none_static_site
    deployable_by: [integrator]
    reachable: true
  production:
    url: "https://aipol.kaps.or.kr"
    source_revision_origin: approved_revision_only
    database: none_static_site
    deployable_by: [release_owner]
    reachable: false
