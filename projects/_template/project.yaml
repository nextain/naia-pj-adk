version: 1
# Explicit opt-in to the common runtime policy contract. Legacy adapters are
# rejected until an owner maps their roles and mutation capabilities.
policy_contract_version: 1
# Deployment profile: server (a shared host with deployment tiers) or local
# (every member works from their own clone). The validator applies only the
# named profile's requirements. For a local team copy projects/_template-local/
# instead; it has no ssh home, no tiers and no deploy commands.
profile: server
# Optional project gateway example. Keep every delegated argv token explicit:
# issue evidence is projected only into the three required markers, and the
# restart job id is the only command-specific value. The bridge receives the
# adapter, authenticated participant, issue evidence, route project and
# canonical workspace; it returns the exact argv/cwd or a denial.
# gateway:
#   project_backend:
#     capabilities:
#       issue_work:
#         commands:
#           submit:
#             argv: [submit, --issue-repository, "{{issue_repository}}", --issue-number, "{{issue_number}}", --issue-assignee, "{{issue_assignee}}"]
#           restart:
#             argv: [restart, --job, "{{job_id}}", --issue-repository, "{{issue_repository}}", --issue-number, "{{issue_number}}", --issue-assignee, "{{issue_assignee}}"]
#           amend:
#             argv: [amend, --issue-repository, "{{issue_repository}}", --issue-number, "{{issue_number}}", --issue-assignee, "{{issue_assignee}}"]
#       production_deploy:
#         argv: [deploy-production, --revision]
#         revision_arg: --revision
#       database_write:
#         argv: [database-write, --revision]
#         revision_arg: --revision
#       rollback:
#         argv: [rollback, --revision]
#         revision_arg: --revision
project:
  id: replace-me
  repository: replace-me/replace-me
  issue_tracker: github
  default_branch: main
  # Start with main-only integration. A project with a separate integration
  # tier must declare its actual branch name here before onboarding.
  integration_branch: main
workspace:
  ssh_home_pattern: "~/project-name"
  branch_pattern: "issue/<number>-<short-name>"
roles:
  contributors: []
  integrators: []
  release_owners: []
team_policy:
  # These values are the source for authority, working hours, approvals, and
  # unanswered-thread assignment. Keep them aligned with discord.contact_window
  # when Discord is enabled; null values force a new project to decide.
  authorization:
    issue_required: null
    chat_grants_authority: null
    production_deploy_role: null
    database_write_requires_explicit_authority: null
    issue_work_roles: null
  work_hours:
    timezone: null
    days: null
    start_hour: null
    end_hour: null
  approval:
    production_deploy: null
    high_system_risk: null
    incident_rollback: null
  assignment:
    issue_assignee_required: null
    # Prefer request_recipient_then_last_human once the messaging host supports
    # validated request bindings. Legacy: last_human_in_thread. See docs/REQUEST-HANDLING.ko.md.
    unanswered_thread_recipient: null
    default_responder_alias: null
discord:
  enabled: false
  project_alias: replace-me
  bot_token_env: DISCORD_BOT_TOKEN
  runtime_registry: .runtime/participants.json
  # 사람에게 확인을 요청해도 되는 시간. Discord 를 켜면 반드시 채웁니다.
  # 서버 시계로 판정하면 표준시간대만큼 어긋나므로 여기에 명시합니다.
  contact_window:
    timezone: null            # 예: Asia/Seoul
    days: null                # 예: [mon, tue, wed, thu, fri]
    start_hour: null          # 예: 10
    end_hour: null            # 예: 18 (이 시각 정각부터는 보내지 않습니다)
  # 담당이 정해지지 않은 요청을 받을 사람. 별칭만 적습니다. 개인 식별자는
  # 추적하지 않는 런타임 등록부에 둡니다.
  default_responder_alias: null
commands:
  validate: "replace-with-project-command"
  deploy_dev: null
  deploy_production: null
guards:
  production_requires_issue_approval: true
  database_write_requires_explicit_authority: true
ops_profile:
  stall_forbidden: true
  inherit: execution.yaml
  # A project may narrow proceed_without_approval. It may not stall a thread
  # on a bounded production read.
  attention_routing:
    bot_work_must_not_land_on_owner: true
    our_turn: dispatch_not_escalate_to_owner
    re_ask_fallback_to_owner: false

execution:
  # Every command here must exit non-zero when its condition is not met.
  # Leaving one null means the project has not yet implemented that guard, and
  # the adapter is not ready for the target it refers to.
  deploy_gate_command: null
  artifact:
    build_from: committed_revision
    intake_scan_command: null
  propagation:
    development:
      reload_command: null
      cache_invalidation_command: null
      serving_revision_proof_command: null
    production:
      reload_command: null
      cache_invalidation_command: null
      serving_revision_proof_command: null
  verification:
    command: null
    required_strings: []
    consecutive_passes: 2
  rollback:
    development: null
    production: null
  concurrency:
    lease_file: .runtime/mutation-lease.json
    shared_targets: [development, production]
  drift_check_command: null
tiers:
  # A tier is a source-and-data pair, not a hostname. Declaring the address
  # twice is how one copy quietly stops matching the other, so every fact about
  # a tier lives here and nowhere else.
  development:
    url: "https://replace.example"
    source_revision_origin: integration_branch
    database: project_declared_non_secret_name
    deployable_by: [integrator]
    reachable: false
  production:
    url: "https://replace.example"
    source_revision_origin: approved_revision_only
    database: never_store_credentials_here
    deployable_by: [release_owner]
    reachable: false
