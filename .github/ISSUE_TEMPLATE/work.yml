name: Project work
description: 모든 개발·검수·배포 작업의 정본 이슈
title: "[project] "
labels: [work]
body:
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 확인 방법과 완료 조건
    validations:
      required: true
  - type: input
    id: assignee_alias
    attributes:
      label: 담당자 별칭
      placeholder: "예: contributor/example"
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 영향 범위와 되돌리기
    validations:
      required: true
  - type: checkboxes
    id: gate
    attributes:
      label: 작업 전 확인
      options:
        - label: 이슈 브랜치에서 작업하며 통합 전 운영 배포나 DB 변경을 하지 않습니다.
          required: true
        - label: 검증 명령과 원시 stdout·stderr·종료코드를 보존할 위치를 정했습니다.
          required: true
        - label: 실패 시 되돌릴 리비전 또는 산출물을 준비했습니다.
          required: true
