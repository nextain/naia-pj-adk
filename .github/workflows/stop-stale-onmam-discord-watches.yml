name: stop-stale-onmam-discord-watches
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stop:
    # Luke PC (hostname bazzite) still runs the old Naia canary and
    # response-check OnFailure DMs. Live gateway is onmam-dev.
    runs-on: [self-hosted, linux, x64, bazzite]
    steps:
      - name: Disable leftover OnMam/Naia Discord watches
        run: |
          set -eu
          echo "host=$(hostname) user=$(id -un) uid=$(id -u)"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          units='
            onmam-gateway-response-check.timer
            onmam-gateway-response-check.service
            onmam-gateway-alive-check.timer
            onmam-gateway-alive-check.service
            onmam-gateway-channel-check.timer
            onmam-gateway-channel-check.service
            onmam-gateway-deaf-check.timer
            onmam-gateway-deaf-check.service
            onmam-gateway-deaf-alert.service
            onmam-gateway-followup-monitor.timer
            onmam-gateway-followup-monitor.service
            onmam-gateway-bind-threads.timer
            onmam-gateway-bind-threads.service
            naia-discord-sessions-71966723456a-supervisor.timer
            naia-discord-sessions-71966723456a-supervisor.service
            naia-discord-sessions-71966723456a.service
          '
          for u in $units; do
            systemctl --user disable --now "$u" && echo "stopped $u" || echo "absent $u"
          done
          echo '=== remaining ==='
          systemctl --user list-timers --all --no-pager | grep -iE 'onmam|naia|discord' || echo none
          systemctl --user is-enabled onmam-gateway-response-check.timer 2>&1 || true
          systemctl --user is-active onmam-gateway-response-check.timer 2>&1 || true
