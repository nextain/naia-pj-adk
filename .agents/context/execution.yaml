version: 1

# Execution and verification contract.
#
# workflow.yaml says which states exist and who may move between them.
# It does not say what a machine must refuse. A workflow that only asks for
# records is satisfied by a well-written record of a broken deployment.
#
# Everything here is written so that a project adapter can implement it as a
# command that exits non-zero. A rule nobody can fail is not a rule.

deploy_gate:
  # A deploy command must refuse before it changes anything, and must refuse
  # on its own rather than relying on the operator having read a document.
  preconditions:
    - name: issue_open
      why: work without a live work item leaves no place to record the result
    - name: worktree_clean
      why: an uncommitted file makes the deployed artifact unidentifiable
    - name: integration_branch_is_ancestor
      why: >
        deploying a branch that does not contain the integration branch silently
        reverts whatever landed since it forked
    - name: change_is_non_empty
      why: a deploy identical to the integration branch hides a failed merge
    - name: actor_is_authorized_for_target
      why: shared and production targets are role-gated, not convention-gated
    - name: staging_precedes_production
      applies_to: production
      why: >
        production may only receive a revision that a staging target already
        serves. Observed 2026-09-01: production ran a commit from sixteen days
        earlier with thirty uncommitted files on top, because production deploy
        did not require staging and the staging path in the deploy script
        pointed at a host that no longer existed. The only remaining route was
        editing production by hand, and the next deploy would have erased it.
    - name: staging_is_reachable
      applies_to: production
      why: >
        a staging target that cannot be opened is not a check. Observed
        2026-09-01: staging had zero requests for twelve days because its
        domain redirected to production, so nobody could see that it had been
        broken the whole time. Confirm staging answers with a body before
        treating a staging pass as evidence.
  failure_behavior: refuse_without_side_effects
  refusal_must_name: [failed_precondition, how_to_satisfy_it]

verification:
  # A deploy is verified by what the site returns, not by the deploy command
  # exiting zero.
  rejects:
    - status_code_only
    - deploy_script_exit_code_as_proof
    - single_page_sampled
  requires:
    - name: body_assertion
      why: >
        Observed 2026-07-13: the site held HTTP 200 for ten hours while serving
        a 495-byte error page. Status code alone cannot see this. Assert body
        size and title.
    - name: empty_body_is_failure
      why: a 200 with an empty body is the shape most outages take here
    - name: two_unlike_surfaces
      why: >
        Observed 2026-09-02: one portal login screen rendered on staging, so the
        change was treated as verified. Church sites were returning zero bytes at
        the same moment. Sample surfaces that fail for different reasons.
    - name: baseline_before_change
      why: >
        an after-value alone cannot tell you whether it is correct. Record the
        same measurements immediately before the change and compare.

incident_response:
  # Approval gates exist to stop unreviewed change. They must not stop recovery.
  #
  # Observed 2026-09-01: rollback sat behind the same approval as ordinary
  # deploys, so a live outage waited for a human while the agent held still.
  # Observed 2026-09-04: Discord threads sat idle because a production *read*
  # was treated as a production *change*, so churches waited while the bot
  # asked for permission to open a public URL.
  when: service_is_down
  signals: [five_xx, empty_body_on_a_page_that_had_one]
  act_without_approval:
    - rollback_to_previous_revision
    - container_restart
    - cache_or_opcache_reload
  order: recover_first_then_diagnose
  before_discarding_state: back_up_what_is_being_replaced
  report: after_recovery

ops_profile:
  # Who may act without a human, on a live system. Three axes, not one
  # "production" flag. Mixing them is how a GET of one page waits for the same
  # approval as dropping a table.
  stall_forbidden: true
  axes:
    user_visible_impact: [high, medium, low]
    system_risk: [high, medium, low]
    traffic_risk: [high, medium, low]
  proceed_without_approval:
    - id: bounded_production_read
      when:
        traffic_risk: [low, medium]
      do: read immediately; never stall a thread to ask for a read
    - id: user_visible_noncritical_deploy
      when:
        user_visible_impact: [high, medium]
        system_risk: [low, medium]
        deploy_needed: true
      do: deploy with the project's formal script, then report
      requires: [rollback_artifact_already_exists, issue_record]
  requires_approval:
    - id: high_traffic_read
      when:
        traffic_risk: high
    - id: high_system_risk
      when:
        system_risk: high
    - id: human_only_decision
    - id: deploy_without_rollback_artifact
  never_infer_from_chat: true
  report_unattended_action_on: [issue, thread]
  attention_routing:
    # Observed 2026-09-04: a follow-up monitor treated bot silence as a human
    # confirmation queue and DMed the release owner every five minutes. The
    # owner was asked to answer work the bot already owed. Professional
    # developers and deployers must not become the default inbox for bot work.
    bot_work_must_not_land_on_owner: true
    our_turn: dispatch_not_escalate_to_owner
    re_ask_target: last_human_in_thread
    re_ask_fallback_to_owner: false
    skip_re_ask_when_work_is_queued: true
    owner_direct_message_only:
      - watchdog_malfunction
      - awaiting_owner_approval_with_deadline
    parked_owner_wait_is_not_a_nudge: true

post_deploy_signals:
  # Sending a signal to the wrong process takes the site down more reliably
  # than a bad commit.
  #
  # Observed 2026-09-01: an OPcache reload sent USR2 to PID 1, which was
  # apache2ctl rather than php-fpm. Every CI site returned 500 and the portal
  # served an empty body. The deployed code was fine.
  rule: resolve_the_target_by_name_not_by_assumed_pid
  on_not_found: say_so_and_fail_loudly

artifact:
  # Build from a committed revision, not from whatever is on disk.
  build_from: committed_revision
  method: export_revision_to_clean_staging_directory
  server_source_mount: forbidden
  immutability: artifact_is_addressed_by_revision_and_never_rebuilt_in_place
  intake_scan:
    required_when: source_crosses_a_trust_boundary
    on_failure: refuse
  rationale: >
    A running environment that is edited in place cannot be compared with any
    revision, so drift becomes undetectable and rollback becomes guesswork.

propagation:
  # Writing files is not the same as the change taking effect.
  declare_per_environment: true
  fields:
    - runtime_caches_that_must_be_invalidated
    - edge_or_cdn_paths_that_must_be_invalidated
    - restart_or_reload_command
    - how_to_prove_the_new_revision_is_serving
  rule: deployment_is_incomplete_until_propagation_is_proven
  rationale: >
    Byte-code and edge caches keep serving the previous revision after the
    files change. Skipping this step produces a deploy that reports success and
    changes nothing.

pass_gate:
  # What counts as a pass. Nested under a second `verification` key the
  # contract parser rejected as a duplicate. Field names like "validation"
  # are not definitions.
  minimum_assertions:
    - status_code
    - minimum_body_size
    - required_content_string
  forbidden_as_sole_evidence:
    - status_code_only
    - internal_health_endpoint_only
    - single_url
    - operator_statement_without_command_output
  gate: process_exit_code
  consecutive_passes_required: 2
  when: [before_change_as_baseline, after_change]
  on_any_failure: stop_and_execute_bound_rollback
  cache_bypass_required_for_recovery_checks: true
  rationale: >
    A failing service can keep returning a success status with an error body,
    and an edge cache can keep serving a stale failure after the fix lands.
    Assertions must read the body, and a recovery check must bypass the cache.

rollback:
  # A described rollback is not a rollback.
  must_be_materialized_before_change: true
  acceptable_forms:
    - previous_artifact_retained_and_addressable
    - configuration_backup_written_and_verified
    - revert_revision_prepared
  bound_to: [target_environment, revision, exact_command]
  verified_by: same_verification_contract_as_the_change
  rationale: >
    Rollback plans written as prose are discovered to be wrong at the moment
    they are needed. The artifact must already exist.

concurrency:
  # One writer per shared target.
  shared_target_requires_lease: true
  lease:
    scope: [environment, owner, expiry]
    max_duration_minutes: 15
    expiry_behavior: alarm_not_auto_release
    release_condition: verification_passed_or_rollback_verified
  concurrent_mutation: forbidden
  rationale: >
    Two simultaneous changes to one environment make both unattributable, and
    an expiring lease that auto-releases invites exactly that.

drift:
  # Declared state versus running state.
  must_be_detectable_for:
    - deployed_revision_versus_integration_branch
    - runtime_configuration_versus_tracked_configuration
    - environment_tier_definition_versus_actual_wiring
  detection: comparison_command_that_exits_non_zero_on_mismatch
  on_detection: record_and_resolve_before_next_deployment
  rationale: >
    Environments drift silently. A tier that quietly stopped existing, or a
    deployment target many revisions behind the integration branch, is only
    found during an incident unless something compares them on purpose.

environment_tiers:
  # A tier is a source-and-data pair, not a hostname.
  declare_per_tier: [source_revision_origin, database, who_may_deploy]
  rule: >
    Changing a tier's database or source origin changes what the tier proves.
    Tier definitions are reviewed as a set, never edited one field at a time.
  tier_must_be_reachable_to_count_as_a_tier: true

watchdog:
  # A watchdog is a promise that silence means nothing is wrong. That promise
  # breaks quietly, because a dead watchdog and a calm system look identical
  # from outside.
  one_item_may_not_stop_the_sweep: true
  per_item_failure: record_and_continue
  rationale: >
    A follow-up monitor iterated over tracked items and fetched each one with a
    command that aborts the script on an error status. One item had been
    completed and its resource was gone, so every run died on it and the
    remaining items — all of them waiting on a person — went unchecked for days.
    The thing that existed to keep waiting work visible was stopped by work that
    had already finished.
  own_failure_must_alarm: true
  own_failure_channel: separate_from_the_watchdog_itself
  rationale_own_failure: >
    If the only way to hear from a watchdog is the watchdog running, its death
    is indistinguishable from good news. The alarm has to come from somewhere
    the failure cannot silence.
  verify_by: forcing_a_failure_and_observing_the_alarm
  pending_human_response:
    # 사람이 답할 차례일 때, 기다리기만 하는 것은 추적이 아니다.
    re_ask_after_minutes: 60
    re_ask_where: the_thread_the_person_is_in
    re_ask_addresses: the_last_person_who_spoke_there
    re_ask_fallback: none
    our_turn: dispatch_not_escalate_to_owner
    skip_re_ask_when_work_is_queued: true
    owner_direct_message_only: [malfunction, awaiting_owner_with_deadline]
    quoted_text_mentions: neutralized
    rationale_addressing: >
      A re-ask that names nobody notifies nobody. It sits in a thread the person
      is not watching, and six items reached the re-ask limit without anyone being
      told. The person being waited on is almost always the last one who spoke
      there, which is derivable without a registry. But text quoted from other
      people must not keep its calling power: one stored summary contained
      "@everyone", and a single confirmation request would have paged the whole
      server. Address the person you decided to address, and leave quoted calls as
      letters.
    minimum_acceptable_reply: an_acknowledgement
    max_re_asks: 3
    then: escalate_as_stuck_rather_than_asking_again
    cleared_by: any_reply_from_a_person
    contact_window:
      # 고장 알림과 확인 요청은 다른 것이다. 요청만 시간으로 막는다.
      applies_to: [re_ask, routine_reminder]
      never_gated: [malfunction, delivery_failure, owed_reply_to_a_waiting_person]
      schedule_source: project_adapter
      timezone_source: project_adapter
      outside_window: defer_without_counting
      urgent_override: per_item_flag
      health_vocabulary: follow_the_watched_tools_own_terms
      rationale: >
        Alerting that something is broken and asking a person to confirm are
        different acts. Breakage has to be heard whenever it happens, but "please
        confirm" only means anything while the person is working. An hourly ask at
        night and on weekends does not make the answer arrive sooner; it teaches
        people to ignore the channel. Outside the window the ask is deferred
        without counting, because counting it spends the re-ask budget while
        nobody could see it. Only an item marked urgent passes.
    rationale: >
      A watchdog that only tells the operator is invisible to the person whose
      answer it needs. Two items waited more than a day while the only signal
      went somewhere else. Asking again in the same place, and saying that a
      single "received" is enough, turns silence into a decision someone made
      rather than a message nobody saw. Repeating forever teaches people to
      ignore the channel, so the loop ends and becomes an escalation.
  stale_entry_policy: >
    An entry whose subject no longer exists is resolved or removed, not left to
    fail forever. A permanent false alert trains people to ignore the channel.

completion:
  # Who decides that work is done.
  ai_may_not_declare_completion: true
  decided_by: named_human_acceptance_against_written_steps
  evidence_required: [environment, revision, operator, verification_output, rollback_reference]
  rationale: >
    An agent reports what it observed. Whether that satisfies the request is a
    human judgment, and recording it as such is what makes the record usable
    later.

incident_severity:
  # 승인을 구하는 일 자체가 비용이다. 서비스가 죽었는데 승인을 기다리면 그
  # 시간만큼 사용자가 못 쓴다. 반대로 되돌리기 어려운 변경을 승인 없이 지르면
  # 장애가 더 커진다. 급한 것과 위험한 것은 다르므로 축을 나눈다.
  #
  # 2026-09-02: 명백한 장애에까지 승인을 요청해 복구가 지연됐다.
  axes:
    business_impact:
      asks: what_the_user_cannot_do_right_now
      high: cannot_reach_service_or_use_core_function
      medium: degraded_but_a_workaround_exists
      low: user_does_not_notice
      excludes: the_cost_of_fixing_it
    system_risk:
      asks: how_hard_the_fix_itself_is_to_undo
      high: data_changes_or_hard_to_reverse
      medium: reversible_but_causes_interruption
      low: one_setting_backed_up_and_instantly_reversible
      excludes: how_severe_the_outage_is
  decision:
    - when: business_impact_high
      then: act_without_approval_and_report_after
    - when: system_risk_low
      then: act_without_approval_regardless_of_impact
    - when: system_risk_high
      then: write_the_rollback_plan_first_then_request_approval_with_it
    - otherwise: follow_the_normal_order_staging_then_production
  rollback_plan_fields: [what_was_backed_up, exact_command_to_revert, what_to_verify_after]
  self_challenge:
    # 등급은 자기가 매기고 자기가 쓴다. 편한 쪽으로 기운다.
    business_impact_low: "이 상태로 하루를 더 두면 누가 무엇을 못 하는지 적어 본다. 적히면 낮음이 아니다"
    system_risk_low: "백업 경로를 실제로 댈 수 있는지 확인한다. 대지 못하면 낮음이 아니다"
    both_low: "왜 이것이 장애로 올라왔는지 설명해 본다. 설명이 안 되면 다시 본다"
    on_fail: raise_the_grade
    once_raised: never_lowered

health_verification:
  # 응답 코드만 보는 감시는 겉으로 정상인 고장을 한 번도 잡지 못한다.
  #
  # 2026-08-26 부터 6일 넘게 네 개 앱이 데이터베이스에 붙지 못한 채로
  # 운영됐다. 서버는 HTTP 200 을 계속 돌려주었고 본문만 비어 있었다.
  # 운영 모드라 오류 화면이 꺼져 있었고 log_errors 가 Off 라 오류가
  # 어디에도 남지 않았다. 사람의 신고로 처음 발견됐다.
  status_code: not_used_as_a_verdict
  rules:
    - two_hundred_with_an_empty_body_is_a_failure
    - assert_that_required_content_is_actually_present_by_string
    - a_path_that_returns_a_verdict_must_return_one_empty_is_a_failure
    - connect_to_the_database_with_the_config_the_app_itself_uses
    - check_at_least_two_screens_of_different_kinds
  alerting:
    # 발견이 고장으로 읽히면 아무도 보지 않는다.
    never: leave_failure_only_as_a_unit_start_failure
    verify_by: deliberately_failing_it_and_confirming_the_alert_arrives
    also_verify: on_failure_wiring_fires_automatically
  timer:
    use: on_calendar
    avoid: on_boot_sec
    why: losing_the_reference_point_stops_it_forever

defect_origin:
  # 같은 결함이 여러 파일에 복사돼 있으면 발견되는 곳마다 새 이슈가 된다.
  # 원인이 같은 것이 아니라 같은 실수가 흩어진 것이다.
  #
  # 2026-09-02: 업로드 경로 계산 결함이 세 컨트롤러에 각각 있었고,
  # 세 개의 이슈로 따로 올라와 따로 고쳐졌다. 남은 곳에서 또 재발했다.
  on_fix: search_every_occurrence_of_the_same_shape_first
  when_repeated_three_times: extract_into_one_shared_function
  fixing_only_where_reported: guarantees_recurrence
