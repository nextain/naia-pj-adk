version: 1

# Deployment-neutral execution contract.
#
# Everything here holds whether a team shares one server or every member works
# from their own clone. What only makes sense once a shared deployment target
# exists — deploy gates, artifacts, propagation, tiers, leases, drift — lives in
# profiles/server/context/execution.yaml and is loaded by adapters that declare
# `profile: server`.
#
# The split exists because a local-profile team was being asked to answer a
# production deploy contract it has no target for, and answering it with nulls
# made the contract look satisfied.
#
# Everything here is written so that a project adapter can implement it as a
# command that exits non-zero. A rule nobody can fail is not a rule.

ops_profile:
  # Whether an agent may act without waiting for a person. The risk axes that
  # grade a live system live in the server profile; what stays here is the rule
  # that attention must not be parked on the wrong person.
  stall_forbidden: true
  never_infer_from_chat: true
  # A registered operator replying "승인" to a concrete plan in the issue thread
  # is the approval. Observed 2026-09-10 on onmam-dev #403: the contract bound an
  # approval to a commit SHA, an exact command and an expiry, so the owner's own
  # reply did not match it and was refused. A 30-minute reversible change spent
  # four days producing readiness artifacts instead.
  thread_reply_is_approval: true
  # Readiness is the agent's work, and it scales with risk. Demanding a flagship
  # review and an exclusive mutation lease for a change a backup can undo turns
  # every task into preparation.
  readiness_by_risk:
    low: [backup_or_rollback_path, issue_record, post_change_verification]
    medium: [backup_or_rollback_path, issue_record, post_change_verification]
    high: [reviewed_script, rollback_artifact, independent_risk_review, exclusive_mutation_lease, public_smoke]
  never_ask_again_for: [readiness, backup, runner, review, lease, worktree_state, format]
  # If a backup makes it undoable, it is not high. Raising the grade requires
  # writing down what exactly cannot be undone.
  system_risk_medium_examples: [wp_theme_plugin_copy_with_backup, container_restart, image_swap, formal_deploy_script]
  report_unattended_action_on: [issue, thread]
  attention_routing:
    # Bot silence is a queueing problem, not a reason to turn the release owner
    # into the default inbox for work the bot already owes.
    bot_work_must_not_land_on_owner: true
    our_turn: dispatch_not_escalate_to_owner
    re_ask_target: adapter_policy_with_validated_request_recipient
    re_ask_fallback_to_owner: false
    skip_re_ask_when_work_is_queued: true
    owner_direct_message_only:
      - watchdog_malfunction
      - awaiting_owner_approval_with_deadline
    parked_owner_wait_is_not_a_nudge: true
    collaborator_ok_on_non_owner_gated: true

confirmation_request:
  # 아무도 지명하지 않은 확인 요청은 아무에게도 알림을 울리지 않는다.
  #
  # A request that names nobody notifies nobody, and a request with no return
  # address produces an answer that lands where the asker is not reading.
  required_fields: [who, what, where_exactly, where_to_report_back, work_item, plan_ref, reply_template, expiry]
  quoted_text_mentions: neutralized
  rationale: >
    The address fields identify the recipient and return path; work item,
    plan reference, reply template and expiry make the decision reviewable. Without
    "who" the message sits in a thread nobody owns. Without "where exactly" the
    person guesses which surface to look at. Without "where to report back" the
    answer is written somewhere the asker never reads. And text quoted from
    other people must not keep its calling power: one stored summary contained
    a server-wide mention, and a single confirmation request would have paged
    everyone.

acknowledgement:
  # 게시 성공은 수신이 아니고, 수신은 시작이 아니다.
  definition: a_committed_start_receipt_naming_the_process_and_its_start_time
  not_acknowledgement:
    - message_posted_successfully
    - message_delivered
    - a_reply_saying_it_was_received
    - a_preparation_report
    - a_heartbeat_with_no_receipt
  rationale: >
    Posting, receiving and starting are three events, and treating them as one
    is how work is recorded as under way while nothing is running. Only a
    receipt written by the process that started proves the third.

watchdog:
  # A watchdog is a promise that silence means nothing is wrong. That promise
  # breaks quietly, because a dead watchdog and a calm system look identical
  # from outside.
  one_item_may_not_stop_the_sweep: true
  per_item_failure: record_and_continue
  rationale: >
    A follow-up monitor must record a missing or completed item and continue
    checking the remaining work. Otherwise one stale resource can hide every
    item still waiting for a person.
  own_failure_must_alarm: true
  own_failure_channel: separate_from_the_watchdog_itself
  rationale_own_failure: >
    If the only way to hear from a watchdog is the watchdog running, its death
    is indistinguishable from good news. The alarm has to come from somewhere
    the failure cannot silence.
  verify_by: forcing_a_failure_and_observing_the_alarm
  watcher_location: outside_the_machine_being_watched
  timer:
    use: on_calendar
    avoid: on_boot_sec
    why: losing_the_reference_point_stops_it_forever
  alerting:
    # 발견이 고장으로 읽히면 아무도 보지 않는다.
    never: leave_failure_only_as_a_unit_start_failure
    verify_by: deliberately_failing_it_and_confirming_the_alert_arrives
    also_verify: on_failure_wiring_fires_automatically
  pending_human_response:
    # 사람이 답할 차례일 때, 기다리기만 하는 것은 추적이 아니다.
    re_ask_after_minutes: 60
    re_ask_where: the_thread_the_person_is_in
    re_ask_addresses: validated_request_recipient_else_registered_speaker_if_no_request
    re_ask_fallback: none
    our_turn: dispatch_not_escalate_to_owner
    skip_re_ask_when_work_is_queued: true
    owner_direct_message_only: [malfunction, awaiting_owner_with_deadline]
    quoted_text_mentions: neutralized
    rationale_addressing: >
      Preserve the intended recipient even if another person speaks later.
      Missing, stale or invalid explicit requests are agent preparation work.
      Only a thread without an active request may fall back to its last
      registered human speaker. Never fall back to an owner or default inbox.
    minimum_acceptable_reply: an_acknowledgement
    max_re_asks: 3
    then: escalate_as_stuck_rather_than_asking_again
    cleared_by: authenticated_response_bound_to_the_active_request
    contact_window:
      # 고장 알림과 확인 요청은 다른 것이다. 요청만 시간으로 막는다.
      applies_to: [re_ask, routine_reminder]
      never_gated: [malfunction, delivery_failure, owed_reply_to_a_waiting_person]
      schedule_source: project_adapter
      timezone_source: project_adapter
      outside_window: defer_without_counting
      urgent_override: false
      health_vocabulary: follow_the_watched_tools_own_terms
      rationale: >
        Alerting that something is broken and asking a person to confirm are
        different acts. Breakage has to be heard whenever it happens, but "please
        confirm" only means anything while the person is working. An hourly ask at
        night and on weekends does not make the answer arrive sooner; it teaches
        people to ignore the channel. Outside the window the ask is deferred
        without counting, because counting it spends the re-ask budget while
        nobody could see it. An urgent flag must not open that door: a re-ask
        marked urgent is still a re-ask.
    rationale: >
      A watchdog that only tells the operator is invisible to the person whose
      answer it needs. Two items waited more than a day while the only signal
      went somewhere else. Asking again in the same place, and saying that a
      single "received" is enough, turns silence into a decision someone made
      rather than a message nobody saw. Repeating forever teaches people to
      ignore the channel, so the loop ends and becomes an escalation.
  stale_entry_policy: >
    An entry whose subject no longer exists is resolved or removed, not left to
    fail forever. A permanent false alert trains people to ignore the channel.

completion:
  # Who decides that work is done.
  ai_may_not_declare_completion: true
  decided_by: named_human_acceptance_against_written_steps
  evidence_required: [work_item, revision, operator, verification_output]
  rationale: >
    An agent reports what it observed. Whether that satisfies the request is a
    human judgment, and recording it as such is what makes the record usable
    later. A server-profile deployment adds environment and rollback reference
    to this list; see profiles/server/context/execution.yaml.

defect_origin:
  # 같은 결함이 여러 파일에 복사돼 있으면 발견되는 곳마다 새 이슈가 된다.
  # 원인이 같은 것이 아니라 같은 실수가 흩어진 것이다.
  #
  # Repeated path calculation or validation in separate handlers tends to be
  # fixed only where it was reported and then returns elsewhere.
  on_fix: search_every_occurrence_of_the_same_shape_first
  when_repeated_three_times: extract_into_one_shared_function
  fixing_only_where_reported: guarantees_recurrence

approval_handling:
  authorization_and_execution_readiness_are_separate: true
  environment_scope:
    policy_api: deploymentApprovalRequirement
    default: all_declared_environment_classes
    canonical_classes: [production, staging, dev, personal]
    override_source: reviewed_host_policy_not_model_output
    scope_requires: nonempty_dense_unique_canonical_classes
    human_only_decisions: independent_of_deployment_environment_scope
    outside_scope: continue_host_gates_without_new_human_request
    unknown_environment_or_scope: agent_preparation
    grants_execution_or_credential_authority: false
  preserve_existing_scope: true
  preparation_owner: agent
  short_reply_binding_requires: [authenticated_approver, current_reviewed_plan, same_work_item_target_and_effect, explicit_reply_to_plan]
  execution_requires: valid_unexpired_unconsumed_authorization_when_approval_is_required
  short_reply_is_not_standalone_authority: true
  request_after: [candidate, verification, rollback_preparation, required_review]
  ask_again_only_for: [expanded_scope_or_risk, revoked_or_expired_authorization, unresolved_human_decision]
  never_ask_again_for: [missing_runner, backup_preparation, review_pending, agent_generated_command_hash_missing]
  execution_gates_still_required: true
  no_answer_is_not_approval: true
  transport_health_is_not_work_health: true
  work_review_signals: [report_without_next_action, approval_rejected_for_preparation, request_without_recipient_or_reply_template]
  work_review_signals_grant_no_authority: true
  invalid_wait_action: agent_review_with_evidence_before_state_change

held_work:
  state_source: explicit_host_state_with_native_human_provenance
  never_infer_from: [bot_summary, reply_template, missing_agent_preparation, request_to_stop_asking_for_approval]
  suppress_human_nudges: true
  invalid_hold_action: bounded_agent_audit_before_state_change
  audit_requires: [canonical_work_item_and_thread, native_human_authors_and_content, complete_history_before_release, current_wait_fingerprint, original_effect_reconciliation]
  recheck_before_commit: [native_content_and_edits, newer_received_human_messages, current_source_and_wait]
  preserve: [previous_wait_evidence, explicit_human_hold, unknown_effects, existing_authorization_scope]
  audit_grants_authority: false
  incomplete_audit_action: agent_reconciliation_without_automatic_recursive_replay
