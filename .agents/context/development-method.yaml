version: 1

# How work is defined before it is built.
#
# `workflow.yaml` moves an item between states and `execution.yaml` decides what
# a machine refuses at deploy time. Neither says how a request becomes a
# buildable specification, and that is where large tasks actually fail.
#
# The observed failure is specific: an agent handed a big request starts
# implementing immediately, fixes part of it, and reports the whole task done.
# Small edits hide this because the goal fits inside the sentence that asked
# for it. Large ones do not.

vocabulary:
  # Axis zero. Everything below depends on words meaning one thing.
  glossary_required: true
  undefined_term_behavior: ask, never infer
  rationale: >
    An abbreviation read the wrong way propagates through scope, tests, and
    review without ever looking wrong. In the reference project "FE" was read
    as Frontend when it meant Feature, and the whole specification drifted from
    a single guess. A term that is not in the glossary is a question, not a
    guess.
  applies_to: [requests, issues, contracts, commit messages, review comments]

change_classification:
  # Decide the size before assigning the work, not after.
  required_before_assignment: true
  classes:
    - id: simple_change
      definition: one file family, no schema change, no new user-visible behavior
      requires: [issue, verification, rollback]
    - id: feature_change
      definition: new or changed user-visible behavior, or multiple coupled files
      requires: [issue, use_case, feature_spec, tests, verification, rollback]
    - id: high_impact_change
      definition: >
        shared data, authority, routing, credentials, or anything touching a
        production tier
      requires: [everything_in_feature_change, independent_review]
  misclassification_behavior: escalate_to_the_larger_class
  rationale: >
    The cost of treating a simple change as a feature is a little paperwork.
    The cost of the reverse is a half-finished feature reported as complete.

use_case:
  # What the requester wants, in their words, testable.
  written_by: requester_or_agent_on_their_behalf
  confirmed_by: requester
  fields: [actor, precondition, steps, expected_result, acceptance_criteria]
  rule: work does not start without a confirmed use case for feature_change and above
  acceptance_criteria_must_be: observable_by_the_requester_without_reading_code

feature_spec:
  # What will be built, and what it touches.
  derived_from: use_case
  fields: [behavior, interface, data, impact_scope, out_of_scope]
  impact_scope_layers:
    - directly_changed
    - depends_on_the_change
    - shares_state_with_the_change
  rule: >
    A feature spec that lists no third layer has not been checked for shared
    state; say so explicitly rather than leaving the field empty.

tests:
  use_case_test:
    purpose: proves the requester's scenario works
    run_by: human_against_the_running_environment
    gates: deployment_acceptance
  feature_test:
    purpose: proves the behavior and prevents regression
    run_by: automation
    gates: merge
  rule: a passing feature test does not satisfy a use case test, and the reverse is also false

independent_review:
  # For high-impact changes, the implementer is not the reviewer.
  required_for: [high_impact_change]
  reviewer_must_be: independent_of_the_implementation
  reviewer_reads: [exact_diff, exact_commands, runbook, blast_radius, concurrent_work, rollback, verification_plan]
  receipt_binds: [diff_digest, command_digest, runbook_digest, baseline_digest, rollback_digest]
  invalidated_by: any_change_to_a_bound_input_or_to_the_environment_baseline
  unavailable_reviewer_behavior: do_not_proceed
  rationale: >
    Review that is not bound to exact inputs is an opinion about an earlier
    version. Binding the digests is what makes the verdict mean something when
    the command finally runs.

shared_data:
  # Regex guards are assistance. Privilege separation is the guarantee.
  layers:
    - id: content_scan
      strength: leaky
      note: pattern matching over commands and diffs; helps, never proves
    - id: policy_declaration
      strength: procedural
      note: written authority per environment in the project adapter
    - id: privilege_separation
      strength: authoritative
      note: the credential in use cannot perform the forbidden write
  rule: >
    Until privilege separation is active, the only real barrier is leaky. State
    that plainly in the adapter instead of describing the project as protected.
  read_policy:
    allowed_without_review: single_row_or_indexed_lookup_with_explicit_limit
    requires_review: full_scan, multi_join, aggregate, unknown_plan
    rationale: >
      A shared database is saturated by heavy reads, not only by writes, and a
      thin development copy does not predict production behaviour.

completion:
  # Repeated here because this is the axis people skip first.
  ai_may_not_declare_completion: true
  required_before_claiming_done:
    - every_step_of_the_class_was_recorded
    - use_case_test_result_from_a_named_person
    - verification_output_with_its_exit_code
  missing_step_behavior: report_status_to_a_human, do_not_close

review_orchestration_caps:
  # Observed 2026-10-06: instruction review ran 7, 4 and 9+ rounds on three
  # parallel work items and delayed implementation by over an hour. One rule per
  # line; the incident and its causes live in docs/INCIDENT-2026-10-06-review-loop.ko.md.
  instruction_review_once: "Instruction review runs once. A second round only for a core behavior contradiction (data loss, billing error, race, security); every other finding is folded into the instruction and implementation starts, then code review confirms it."
  code_review_max_two: "Code review runs at most twice. After that the coordinator reads the finding text and either fixes and reruns with an override, or asks the owner. The coordinator never turns a FAIL into a pass."
  coordinator_reads_every_fail: "The coordinator reads every FAIL text in the round it arrives. Monitoring covers progress (stage, round, time in stage), not only liveness (record timestamps)."
  design_before_instruction: "Items that need design (races, structural change, new contracts) get their design fixed by the coordinator before the instruction exists. Instruction review is never used to do design."
  instruction_is_short: "An instruction holds the requirement, the files to change, and the core tests only. Scope is stated per file; no function lists."
  split_independent_items: "Independent items get separate instructions and commits, and the first one ready goes to DEV first."
  stage_time_budget: "Stage budgets: analysis 15 minutes, instruction review once, implementation 30 minutes, code review twice. Past a budget the coordinator steps in and tells the owner the expected completion time."
  enforcement: "The review runner (reference implementation: alpha-adk .agents/scripts/review-run.mjs with .claude/hooks/lib/review-integrity.js) refuses the third round of the same issue, stage and target, counted from the per-issue verdict history so renaming a gate does not reset it, and prints the earlier FAIL summary; only the coordinator passes --coordinator-override with a reason, and every override is recorded and announced on the team channel. An override lifts the round cap only. Any review runner used here keeps the same cap."

review_integrity:
  # Observed 2026-10-08: a product feature drifted from the owner's definition
  # although every stage had an adversarial review. The basis slid from the
  # owner's words to AI-written design notes, a later FAIL did not cancel an
  # earlier PASS, renaming a gate reset the round count, and five design FAILs
  # were waved through by the coordinator. One rule per line; the incident
  # lives in docs/INCIDENT-2026-10-08-review-drift.ko.md.
  pass_rule: "A stage passes when the latest verdict for the same issue, canonical stage and target is a single PASS. A later FAIL voids earlier PASS records and every later stage."
  canonical_stages: "plan < design < instruction < code < qc. Design is a reviewed stage, not a coordinator note."
  owner_source_basis: "Every review basis includes at least one owner-source record: a file whose name starts with the owner-source prefix (luke- in the reference workspace) holding the owner's verbatim utterances or requests. A basis of AI-written design or summary documents alone is refused."
  basis_bound_by_hash: "Basis files are hashed into the verdict record. If a basis file changes after the review, the review is void."
  history_keyed_by_issue: "Verdict history is one append-only ledger keyed by issue, canonical stage and normalized target, not by the gate or work folder name. Each line carries the hash of the previous line and the head is kept outside the repository. A consumer never accepts an old PASS from another work folder when a newer verdict exists. A broken ledger is not opened by a coordinator override, only by the owner's one-time code."
  upstream_lock: "A plan or design FAIL cannot be overridden by the coordinator, and while it stands the runner refuses later-stage reviews and the run gate refuses agent runs. Only the owner's one-time code typed in the conversation opens it; an AI-written approval file, quote or flag does not."
  override_notice: "Every override (coordinator round-cap override or owner one-time code) is appended to the override log and announced on the team channel. A failed announcement is recorded and reported, and does not block."
  fixed_questions: "Every review prompt carries two fixed questions added by the runner: did the basis narrow the scope relative to the owner's words or prior art, and did the work invent a method different from the reference implementation."
  no_decision_from_implementation: "A decision document is never rewritten to match an implementation. Owner-reserved product and scope decisions close only with the owner's actual approval."
  blocking_tests: "The runner ships tests proving that gate renaming, stale PASS reuse, summary-as-source, AI proxy approval and design-FAIL override are all refused."
  enforced_by: "alpha-adk review-run.mjs (runner), .claude/hooks/lib/agent-run-gate.js (agent run consumer) and .claude/hooks/deploy-guard.js (owner one-time code). A project that runs its own review runner must implement the same checks before it claims this method."
