version: 1

# How work is defined before it is built.
#
# `workflow.yaml` moves an item between states and `execution.yaml` decides what
# a machine refuses at deploy time. Neither says how a request becomes a
# buildable specification, and that is where large tasks actually fail.
#
# The observed failure is specific: an agent handed a big request starts
# implementing immediately, fixes part of it, and reports the whole task done.
# Small edits hide this because the goal fits inside the sentence that asked
# for it. Large ones do not.

vocabulary:
  # Axis zero. Everything below depends on words meaning one thing.
  glossary_required: true
  undefined_term_behavior: ask, never infer
  rationale: >
    An abbreviation read the wrong way propagates through scope, tests, and
    review without ever looking wrong. In the reference project "FE" was read
    as Frontend when it meant Feature, and the whole specification drifted from
    a single guess. A term that is not in the glossary is a question, not a
    guess.
  applies_to: [requests, issues, contracts, commit messages, review comments]

change_classification:
  # Decide the size before assigning the work, not after.
  required_before_assignment: true
  classes:
    - id: simple_change
      definition: one file family, no schema change, no new user-visible behavior
      # UT is required only when code changes (artifacts.UT.condition).
      requires: [issue, verification, rollback, UT]
    - id: feature_change
      definition: new or changed user-visible behavior, or multiple coupled files
      # SP is required only when a screen unit changes (artifacts.SP.condition).
      requires: [issue, use_case, feature_spec, tests, verification, rollback, RQ, IT, E2E]
    - id: high_impact_change
      definition: >
        shared data, authority, routing, credentials, or anything touching a
        production tier
      # PC, SP, PL, and QC are required for high impact changes.
      requires: [everything_in_feature_change, independent_review, PC, SP, PL, QC]
  misclassification_behavior: escalate_to_the_larger_class
  rationale: >
    The cost of treating a simple change as a feature is a little paperwork.
    The cost of the reverse is a half-finished feature reported as complete.

use_case:
  # What the requester wants, in their words, testable.
  maps_to: UC
  written_by: requester_or_agent_on_their_behalf
  confirmed_by: requester
  fields: [actor, precondition, steps, expected_result, acceptance_criteria]
  rule: work does not start without a confirmed use case for feature_change and above
  acceptance_criteria_must_be: observable_by_the_requester_without_reading_code

feature_spec:
  # What will be built, and what it touches.
  maps_to: FE
  derived_from: use_case
  fields: [behavior, interface, data, impact_scope, out_of_scope]
  impact_scope_layers:
    - directly_changed
    - depends_on_the_change
    - shares_state_with_the_change
  rule: >
    A feature spec that lists no third layer has not been checked for shared
    state; say so explicitly rather than leaving the field empty.

tests:
  use_case_test:
    maps_to: E2E
    purpose: proves the requester's scenario works
    run_by: human_against_the_running_environment
    gates: deployment_acceptance
  feature_test:
    maps_to: UT
    purpose: proves the behavior and prevents regression
    run_by: automation
    gates: merge
  rule: a passing feature test does not satisfy a use case test, and the reverse is also false

independent_review:
  # For high-impact changes, the implementer is not the reviewer.
  required_for: [high_impact_change]
  reviewer_must_be: independent_of_the_implementation
  reviewer_reads: [exact_diff, exact_commands, runbook, blast_radius, concurrent_work, rollback, verification_plan]
  receipt_binds: [diff_digest, command_digest, runbook_digest, baseline_digest, rollback_digest]
  invalidated_by: any_change_to_a_bound_input_or_to_the_environment_baseline
  unavailable_reviewer_behavior: do_not_proceed
  rationale: >
    Review that is not bound to exact inputs is an opinion about an earlier
    version. Binding the digests is what makes the verdict mean something when
    the command finally runs.

shared_data:
  # Regex guards are assistance. Privilege separation is the guarantee.
  layers:
    - id: content_scan
      strength: leaky
      note: pattern matching over commands and diffs; helps, never proves
    - id: policy_declaration
      strength: procedural
      note: written authority per environment in the project adapter
    - id: privilege_separation
      strength: authoritative
      note: the credential in use cannot perform the forbidden write
  rule: >
    Until privilege separation is active, the only real barrier is leaky. State
    that plainly in the adapter instead of describing the project as protected.
  read_policy:
    allowed_without_review: single_row_or_indexed_lookup_with_explicit_limit
    requires_review: full_scan, multi_join, aggregate, unknown_plan
    rationale: >
      A shared database is saturated by heavy reads, not only by writes, and a
      thin development copy does not predict production behaviour.

artifacts:
  # Default locations; a project may override them in project.yaml `artifacts`.
  PC:
    purpose: "defines why the product or project is built, its core essence, user value, information architecture, and ownership boundaries"
    id_rule: PC
    derived_from: []
    required_for: [high_impact_change]
    condition: "one per project; create only when missing"
    owner: null
    location: docs/planning/PC.md
  SP:
    purpose: "defines the space and wireframes seen by users, including layout, visual component placement, and navigation flow"
    id_rule: SP-NN
    derived_from: [PC]
    required_for: [feature_change, high_impact_change]
    condition: "feature_change only when a screen unit changes"
    owner: null
    location: docs/planning/SP-NN.md
  UC:
    purpose: "describes the end-to-end user journey, context, and motivation as users enter, achieve goals, and exit"
    id_rule: UC-NN
    derived_from: [SP]
    required_for: [feature_change, high_impact_change]
    condition: "always"
    owner: null
    location: docs/planning/UC-NN.md
  RQ:
    purpose: "specifies functional and non-functional conditions and measurable acceptance criteria required to fulfill UC and SP"
    id_rule: RQ-NN
    derived_from: [UC]
    required_for: [feature_change, high_impact_change]
    condition: "always"
    owner: null
    location: docs/planning/RQ-NN.md
  PL:
    purpose: "verifies technical reality and establishes architecture and a phased implementation roadmap"
    id_rule: PL-NN
    derived_from: [RQ]
    required_for: [high_impact_change]
    condition: "always"
    owner: null
    location: docs/planning/PL-NN.md
  FE:
    purpose: "defines concrete feature units specifying what to build to realize UC and RQ"
    id_rule: FE-NN
    derived_from: [UC, RQ, PL]
    required_for: [feature_change, high_impact_change]
    condition: "PL is an input only when it exists"
    owner: null
    location: docs/planning/FE-NN.md
  UT:
    purpose: "verifies that feature units operate according to FE specifications"
    id_rule: UT-NN
    derived_from: [FE]
    required_for: [simple_change, feature_change, high_impact_change]
    condition: "simple_change only when code changes"
    owner: implementer
    location: project test directory
  IT:
    purpose: "verifies end-to-end backend components through APIs, database, and queues without user interface"
    id_rule: RECEIPT-IT-{ISSUE}-{YYYYMMDD}-{SEQ}
    derived_from: [FE]
    required_for: [feature_change, high_impact_change]
    condition: "always"
    owner: implementer
    location: docs/receipts/RECEIPT-IT-{ISSUE}-{YYYYMMDD}-{SEQ}.md
  E2E:
    purpose: "verifies the complete user journey from real screen to real backend against UC"
    id_rule: RECEIPT-E2E-{ISSUE}-{YYYYMMDD}-{SEQ}
    derived_from: [SP, UC]
    required_for: [feature_change, high_impact_change]
    condition: "not applicable only for a unit whose SP has no screen, citing that SP section"
    owner: implementer
    location: docs/receipts/RECEIPT-E2E-{ISSUE}-{YYYYMMDD}-{SEQ}.md
  QC:
    purpose: "validates adversarial user value and safety against PC and SP independently from developer scenarios"
    id_rule: QC-NN
    derived_from: [PC, SP]
    required_for: [high_impact_change]
    condition: "always"
    owner: independent_qc
    location: docs/receipts/QC-NN.md

planning_order:
  sequence: [PC, SP, UC, RQ, PL, FE]
  phases: [technical_review, document_planning, issue, implementation]

feedback_loop:
  rule: a document error found during implementation is fixed in the upstream document first, then reflected downstream

implementation_order:
  sequence: [UT, IT, SCREEN, E2E, QC]
  rule: no screen expansion before the IT gate passes

scope_lock:
  name: pre-issue scope lock
  before: issue
  records: [source_digests, requirement_units, acceptance, disposition, owner, transition_condition]
  approval_filled_by: human_only
  ai_may_decide_disposition: false
  relock_when: [issue_changes, acceptance_changes]

receipts:
  fields: [total, passed, failed, skipped, exit_code, target_url, artifact_paths, reviewer_questions]
  reviewer_questions: [Q1, Q2, Q3]
  closure:
    requires: [IT, E2E]
    e2e_not_applicable_only_when: the unit's SP has no screen, with the SP section cited
    note: a unit whose SP has a screen needs E2E even when only the backend changed

qc:
  inputs: [PC, SP]
  independent_session: true
  rule: QC runs in a session and actor separate from the implementer and reads only PC and SP

completion:
  # Repeated here because this is the axis people skip first.
  ai_may_not_declare_completion: true
  required_before_claiming_done:
    - every_step_of_the_class_was_recorded
    - use_case_test_result_from_a_named_person
    - verification_output_with_its_exit_code
  missing_step_behavior: report_status_to_a_human, do_not_close
