version: 1
identity:
  name: naia-pj-adk
  # 선언된 공개 여부는 GitHub 의 실제 값과 같아야 한다. 색인이 아니라 실제를
  # 믿는다. `gh repo view nextain/naia-pj-adk --json visibility` 가 정본이고,
  # package.json 의 private 플래그와 LICENSE 가 같은 사실을 말해야 한다.
  repository: nextain/naia-pj-adk
  visibility: public
  authority_unit: project
source_of_truth:
  work_item: github_issue
  required_records:
    - scope_and_acceptance
    - assignee_and_issue_branch
    - implementation_summary
    - validation_evidence
    - dev_merge_and_deployment
    - production_approval_and_deployment
roles:
  contributor:
    may: [create_issue, work_on_issue_branch, test, request_dev_merge]
    may_not: [merge_dev, deploy_production, mutate_shared_database]
  integrator:
    may: [review_change, merge_dev, deploy_dev, record_dev_result]
    may_not: [deploy_production_without_approval]
  release_owner:
    may: [approve_production, deploy_production, initiate_rollback]
authority:
  deny_by_default: [merge, deployment, database_write, secret_access, production_access]
  rule: access_to_discord_or_ai_tool_never_grants_operational_authority
data:
  tracked_files_must_not_contain: [secret_values, personal_ids, private_hosts, ip_addresses, customer_data, production_topology, runner_state, approval_logs]
  database_policy: each_project_adapter_must_declare_environment_and_write_authority
  public_examples: placeholders_and_disabled_runtime_only
third_party:
  source_and_trademark_notices: downstream_files_retain_their_original_terms
  bundled_third_party_code: none
public_release:
  default: forbidden
  review_scope: [working_tree, hidden_files, generated_files, requirements, progress, logs, git_history, tags, workflows, submodules, licenses]
  approval: owner_must_approve_exact_commit_sha
  candidate_change_invalidates_approval: true
