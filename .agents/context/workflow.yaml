version: 1
states:
  - issue_open
  - branch_active
  - implementation_ready
  - dev_merge_requested
  - dev_deployed
  - acceptance_requested
  - production_approved
  - production_deployed
  - closed
transitions:
  - from: issue_open
    to: branch_active
    requires: [assignee, acceptance_criteria, issue_branch]
  - from: branch_active
    to: implementation_ready
    requires: [implementation_summary, local_validation]
  - from: implementation_ready
    to: dev_merge_requested
    requires: [commit_sha, changed_scope, rollback_plan]
  - from: dev_merge_requested
    to: dev_deployed
    actor: integrator
    requires: [review_result, merged_sha, dev_environment, dev_validation]
  - from: dev_deployed
    to: acceptance_requested
    requires: [acceptance_steps, known_limitations]
  - from: acceptance_requested
    to: production_approved
    actor: release_owner
    requires: [owner_approval]
  - from: production_approved
    to: production_deployed
    actor: release_owner
    requires: [production_sha, deployment_result, rollback_reference]
  - from: production_deployed
    to: closed
    requires: [post_deploy_validation]
rules:
  - all_state_changes_are_recorded_in_issue
  - failed_validation_returns_to_branch_active
  - emergency_changes_still_require_issue_and_post_action_evidence
