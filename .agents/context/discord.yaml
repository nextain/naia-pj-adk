version: 1
topology:
  bot_per_project: 1
  gateway_consumers_per_token: 1
  runtime_location: project_team_runtime
  issue_thread_mapping: one_thread_per_github_issue
identity:
  canonical_format: "[alias/project]"
  alias_source: ignored_runtime_registry
  examples: ["[contributor/example]", "[integrator/example]"]
routing:
  channel_thread:
    key: github_repository_and_issue_number
    purpose: [status, discussion, artifact_delivery, review_request]
  direct_message:
    key: discord_sender_id
    resolves_to: registered_workspace
    grants_authority: false
    unresolved_behavior: fail_closed_and_request_registration
behavior:
  mention_required_in_shared_channel: true
  # 확인을 부탁하면서 대상을 적지 않으면 아무도 자기 일로 받지 않는다.
  # 끝난 일이 아무도 소유하지 않은 확인만 기다리며 멈춘다.
  address_confirmation_requests: true
  confirmation_request_fields: [who, what, where_exactly, where_to_report_back, why_i_could_not_check]
  # operator reply 경로는 멘션을 억제한다. <@id> 는 표시만 되고 알림이 가지 않으므로
  # 이름을 평문으로 함께 적는다.
  mention_does_not_notify_on_operator_reply: true
  coding_runs_in_ssh_workspace: true
  discord_may_not_execute_without_issue: [code_change, merge, deployment, database_change]
  # 승인 게이트는 검토 없는 변경을 막으려는 것이지 복구를 막으려는 것이 아니다.
  # 장애 복구를 일반 배포와 같은 승인 뒤에 묶으면 서비스가 죽은 채로 기다리게
  # 되므로, 롤백·재시작·캐시 재적재는 별도 incident 경로로 둔다.
  incident_overrides_approval: true
  incident_signals: [five_xx, empty_body_on_a_page_that_had_one]
  act_without_approval_during_incident: [rollback, container_restart, cache_reload]
  incident_order: recover_first_then_diagnose
  # 한 번에 하나만 처리하면 재촉이 앞 작업 뒤에 줄을 선다. 재촉조차 막히므로
  # 재촉할수록 줄만 길어진다. 서로 독립적인 작업은 동시에 순회한다.
  concurrency_must_exceed_one: true
  # 사람에게 묻기 전에 스스로 확인할 수 있는지 먼저 본다. 조회하면 알 수 있는
  # 것을 되묻는 순간 일이 사람에게 넘어가고 그만큼 멈춘다.
  #
  # 이미 조회할 수 있는 설정값과 상태를 사람에게 되묻지 않고 먼저 확인한다.
  before_asking_check_yourself: true
  self_verifiable: [설정값, 파일 내용, 응답 상태, 배포 이력, 이슈 상태, DNS 레코드]
  human_only: [서버 콘솔 직접 조작, 외부 업체 계정, 결제, 물리 접근, 사람의 의사결정]
  do_not_delegate_what_you_can_do: true
  # 승인 요청에는 무엇을 결정해 달라는 것인지와, 답이 없을 때의 기본값을 적는다.
  approval_request_fields: [one_sentence_decision, default_if_no_answer]
  # 막히면 막힌 지점을 한 줄로 남기고 그 답이 없어도 되는 나머지를 먼저 끝낸다.
  never_idle_while_waiting: true
  # 이미 닫힌 이슈나 확인된 사항은 완료로 다루고 재확인을 요청하지 않는다.
  do_not_reopen_settled_work: true
  # 개발자가 아닌 사람에게는 경로도 커밋 번호도 명령어도 쓰지 않는다.
  non_developer_audience:
    forbidden: [file_paths, commit_shas, internal_terms, commands, env_var_names]
    required: [what_was_broken, what_the_state_is_now, what_the_reader_should_do]
    form: three_short_sentences
security:
  tracked_registry: schema_and_placeholders_only
  runtime_registry: ignored
  participant_schema: schemas/participants.schema.json
  # The schema cannot express the two invariants below; this command can.
  participant_validator: scripts/validate-participants.mjs
  alias_unique_within_project: true
  sender_has_one_default_workspace: true
  token_owner_lock: required
  duplicate_consumer_behavior: fail_closed

# This is the concrete common-runtime enforcement map. The host supplies the
# authenticated sender and owner-managed projections; the repository guard
# checks their relationship before a backend receives a mutating command.
policy_guard:
  contract_version: 1
  entrypoint: ops/gateway/dcg.sh
  implementation: scripts/policy-guard.mjs
  adapter_policy_source: projects/<project>/project.yaml
  participant_projection: runtime_registry
  authenticated_sender_source: POLICY_SENDER_ID
  actor_binding: sender_id_to_active_participant_alias_and_workspace
  role_binding: participant_roles_to_adapter_roles_and_groups
  issue_work_authority: team_policy.authorization.issue_work_roles
  issue_binding: open_repository_issue_assignee_matches_actor
  work_hour_binding: team_policy.work_hours
  contact_window_binding: discord.contact_window
  operation_bindings:
    read_only: [status, health-check, jobs, job, watch, logs, monitor, history, latest, artifacts list]
    contact_window: [contact-window]
    issue_work: [submit, restart --job, amend]
    attachment_download: [attachment --output]
    launch: [service start, service stop, service restart]
    runtime_management: [service, cutover, cancel]
    production_deploy: [declared_project_backend]
    database_write: [declared_project_backend]
    rollback: [declared_project_backend]
  runtime_management_boundary: owner_local_recovery_only
  runtime_management_forwarding: forbidden_to_remote_project_backend
  remote_router_permission: separately_authenticated_owner_permission_required
  production_revision_binding: delegated_command_revision_matches_issue_approval
  contact_window_backend: never
  host_boundary:
    trusted_inputs: [authenticated_sender, owner_managed_registry, owner_managed_issue_projection]
    outside_repository: [discord_github_authentication, file_permissions, client_credentials]
gateway_monitoring:
  # 감시 자동화가 "설치됐다"와 "동작한다"를 구분하지 않도록 실제 런타임 검증과
  # 의도적인 실패 증명을 계약으로 둔다.
  verify_in_target_runtime: required          # 손 실행은 검증이 아니다
  runtime_divergence_guard: required          # 인터프리터 경로·버전을 스크립트가 스스로 고정
  guard_on_unmet_precondition: exit_nonzero   # 조용히 이어가지 않는다
  state_query_failure: fail_closed            # 바쁜지 모르면 새 작업을 넣지 않는다
  error_output_retention: required            # 이유를 못 적을 때 원문을 남긴다
  failure_notification:
    required_for: every_scheduled_unit
    proof: deliberate_failure_then_confirm_message_arrival
    unit_completion_is_not_delivery: true     # 유닛이 끝난 것은 알림이 갔다는 뜻이 아니다
  outer_watchdog:
    location: outside_the_monitored_host      # 안쪽 감시는 대상과 함께 죽는다
    detects: [host_down, agent_silent, automation_silent]
  reconciliation:
    surfaces: [tracker, github_issue, thread, gateway_binding]
    reports_only: true                        # 대조는 고치지 않고 어긋난 곳만 말한다
    must_print_source_path: true              # seed 와 runtime 이 나뉘면 어느 쪽을 읽었는지 밝힌다
    deliberate_resolution_marker: closed_by   # 사람이 정리한 것은 불일치가 아니다
  human_contact_window:
    # 사람에게 가는 모든 알림이 창을 탄다. 예외는 아래 immediate 뿐이다.
    # 프로브·카나리아·자기점검은 창을 우회하는 malfunction으로 분류하지 않는다.
    applies_to: [thread_nudge, routine_reminder_dm, helper_unit_failure, operator_notice]
    never_gated: [persisted_user_visible, gateway_ws_dead, delivery_failure]
    not_never_gated: [probe_false_positive, canary, one_sample_slow, bot_silence, watchdog_self_test]
    schedule: project_local_business_hours
    timezone_source: project_configuration
    outside_window: defer_without_counting
    urgent_override: false
    health_vocabulary: follow_the_gateways_own_terms
  notice:
    # 승인 프로파일과 알림 정책은 다른 축이다. 구현: ops/gateway/notify-policy.sh
    classify_before_send: true
    urgencies: [silent, window, immediate]
    silent: [synthetic_probe, one_sample_slow, recovery_of_one_sample, canary, watchdog_self_test, bot_silence, flap_recovery]
    window: [thread_nudge, routine_reminder, helper_unit_failure]
    immediate: [persisted_user_visible, gateway_ws_dead, delivery_failure]
    flap:
      fail_streak_before_incident: 2
      recovery_only_if_incident_was_sent: true
      one_sample_fail_then_pass: send_nothing
    outbound_ledger:
      required: true
      fields: [time, process, dest, kind, urgency, result]
      never_store: [token, message_body]
    one_bot_many_senders: every_token_holder_uses_this_policy
  shared_channel:
    audience: everyone_in_the_home_channel
    do_not_post: [synthetic_probe, one_sample_slow, recovery_of_one_sample_slow, canary, watchdog_self_test, bot_silence, flap_recovery, helper_unit_failure]
    do_not_reply_to: [synthetic_probe, canary, watchdog_self_test, one_sample_slow, recovery_of_one_sample_slow]
    never_amplify: true
  signals:
    perfectly_regular_repeated_failure: suspect_never_succeeded
audit:
  issue_records: [requester_alias, thread_reference, job_id, result_summary, commit_or_artifact_reference]

issue_lifecycle:
  implementation: ops/gateway/issue_lifecycle.py
  canonical_key: owner/repository#number
  repository_source: project_adapter_allowlist
  resolution_order: [trusted_thread_binding, unique_explicit_repository_reference, unique_existing_bare_number]
  ambiguous_identity: refuse_enrollment_and_dispatch
  thread_title: canonical_key_then_human_summary
  synthetic_prompt_as_title: forbidden
  parent_channel_auto_dispatch: forbidden
  auxiliary_thread_auto_enrollment: forbidden
  independent_states: [github_issue, followup, execution, thread_archive, delivery]
  worker_completion: followup_pending_unless_deliberately_resolved_or_waiting_for_human
  previous_key_matching: requires_same_thread_binding
  conversation_message_types: [0, 19]
  system_events_clear_owed_reply: false
  tracker_writes: lock_read_modify_write_then_fsync_and_atomic_replace
  adoption: explicit_adapter_migration_and_live_verification_required
  metadata_repair:
    audit_is_read_only: true
    preserve: [messages, canonical_binding, deliberate_human_resolution]
    precondition: compare_current_metadata_and_last_message_with_reviewed_preimage
    archived_rename: unarchive_then_rename_then_restore_archive
    rate_limit: honor_retry_after_then_revalidate_preconditions
    rollback: record_each_applied_step_and_compare_before_restoring
