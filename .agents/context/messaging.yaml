# 메시징 계층 소속. 배치 프로파일과 무관하게 두 프로파일이 함께 지킨다.
#
# 게이트웨이 코드가 인스턴스마다 하나씩 있으면 같은 결함을 인스턴스 수만큼
# 고치게 되고, 한 곳만 고친 채 나머지는 조용히 옛 동작으로 남는다.
version: 1
provider:
  package: naia-messaging
  repository: nextain/naia-messaging
  status: active
transports:
  today: discord
  later: own_messenger
core_is_transport_neutral: true
core_concerns:
  - participants_and_identity
  - threads_bound_to_a_work_item
  - acknowledgement_and_reply_judgement
  - confirmation_request_format
  - attention_routing
  - contact_window
  - watchdog
instance_holds: [pinned_package_configuration, host_work_and_authority_adapters]
instance_must_not_hold: [copied_shared_engine, copied_connection_watchdog]
shared_engine_concerns: [gateway_loop, backend_execution, scope, redaction, delivery, connection_monitoring]
host_adapter_concerns: [work_item_ledger, authorization, effect_reconciliation, work_health]
rule: >
  Consumers pin one naia-messaging package revision. Host work and authority
  adapters may call the shared engine API; they never copy its implementation.
  Package availability does not prove that an adapter has adopted it or that
  its designated runtime has been verified.

# 사람이 공지하는 채널의 수신 구조. 사람이 읽는 설명: docs/MESSENGER-INTAKE.ko.md
# 역할 세션이 채널에 계속 붙어 있으면 세션이 꺼질 때 받을 곳이 함께 사라지고,
# 붙어 있는 동안에는 글마다 그 세션의 문맥이 다시 실린다.
intake:
  listener: layer4_watcher_script
  listener_is_model_session: false
  listener_is_the_single_gateway_consumer: true
  order: [receive, decide_owner, wake_owner_layer2_session, hand_over]
  owner_session_offline: keep_in_owner_inbox
  layer2_sessions_stay_connected: false
  session_to_session_messages: own_messenger_later

# 공지는 공유 맥락 갱신이다. 설명: docs/MESSENGER-INTAKE.ko.md 5절
# 깨움 글은 세션이 꺼지거나 압축되면 사라지므로, 공지는 역할들이 함께 보는 문서에 남긴다.
announcement_updates_shared_context:
  shared_context_document: one_per_instance
  sections: [decisions_and_directives, role_authority_and_ownership, shared_open_items, raw_log]
  valid_entries_only: true
  corrected_entries: keep_corrected_side_mark_old_as_corrected
  layer4:
    model_judgement: routing_only
    raw_log_append: verbatim
    raw_log_dedupe_by: message_id
    raw_log_order_by: message_id
    pick_single_owner: first_named_or_mentioned_role_else_instance_default
    mark_process_candidate_by_keywords: true
    wake_text_includes: [update_shared_context_task, shared_context_path, owner]
  layer2_owner:
    edits: [decisions_and_directives, role_authority_and_ownership, shared_open_items]
    links_change_location_in_raw_log: true
    judges_process_announcement: true
  layer2_other_roles: read_only
  roles_read_first: [session_start, after_compaction]
  process_announcement:
    also_update_process_canonical: true
    canonical_order: [common_structure_in_naia_pj_adk, instance_role_and_procedure_docs, rules_file_one_line_only_when_needed]
  route_to_addressed_roles_only:
    order: [bot_mention_only, role_name_only, broadcast_words_all_roles, small_model_picks_roles, default_contact_role_only]
    broadcast_only_when_everyone_is_called: true
    model_failure: default_contact_role_only_never_retry_or_drop
    log_route_and_reason: true
